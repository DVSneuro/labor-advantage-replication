[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-labor-returns"
version = "0.1.0"
description = "Reproducible public-data analysis of marginal returns to graduate and postdoctoral research labor"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "matplotlib>=3.9,<4",
  "numpy>=2.1,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "pyarrow>=17,<24",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
  "xlrd>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
download-zhang = "research_labor_returns.download.zhang:main"
download-gss = "research_labor_returns.download.gss:main"
download-herd = "research_labor_returns.download.herd:main"
download-ipeds = "research_labor_returns.download.ipeds:main"
download-deflators = "research_labor_returns.download.deflators:main"
download-openalex = "research_labor_returns.download.openalex:main"
reproduce-zhang = "research_labor_returns.analysis.zhang_replication:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
